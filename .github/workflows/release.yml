# Publishes a release, see docs/maintenance.md:
#   - GitHub release v<version> with the binaries (the tag is created with it, so
#     Packagist only sees the new version once the Composer plugin can download them)
#   - Docker image ghcr.io/netgen/ngchecks:<version>, :<major>.<minor>, :<major>
#   - npm packages @netgen/ngchecks and @netgen/ngchecks-<os>-<arch>
name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to release, without "v" (e.g. 1.2.3 or 1.3.0-rc.1)'
                required: true

permissions:
    contents: read

concurrency:
    group: release

jobs:
    github:
        name: GitHub release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            VERSION: ${{ inputs.version }}
        steps:
            - name: Validate version
              run: |
                  echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
                      || { echo "Invalid version: $VERSION"; exit 1; }
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - run: make lint
            - run: make test
            - run: scripts/build-release.sh "$VERSION"
            - uses: actions/upload-artifact@v7
              with:
                  name: release
                  path: dist/
            - name: Create the GitHub release and tag
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  prerelease=""
                  case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
                  gh release create "v$VERSION" dist/*.tar.gz dist/checksums.txt \
                      --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes $prerelease

    docker:
        name: Docker image
        needs: github
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-qemu-action@v4
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/netgen/ngchecks
                  tags: |
                      type=semver,pattern={{version}},value=v${{ inputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
                      type=semver,pattern={{major}},value=v${{ inputs.version }}
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  build-args: VERSION=${{ inputs.version }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  push: true

    npm:
        name: npm packages
        needs: github
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            VERSION: ${{ inputs.version }}
        steps:
            - uses: actions/checkout@v7
            # No registry-url and no token: npm authenticates with trusted publishing (OIDC),
            # configured for each package on npmjs.com, see docs/maintenance.md. A token in
            # the environment would take precedence over it.
            - uses: actions/setup-node@v7
              with:
                  node-version: 'lts/*'
            - uses: actions/download-artifact@v8
              with:
                  name: release
                  path: dist/
            - run: scripts/build-npm.sh "$VERSION"
            - name: Publish (platform packages first, the launcher last)
              run: |
                  tag=latest
                  case "$VERSION" in *-*) tag=next ;; esac
                  for package in dist/npm/ngchecks-*; do
                      npm publish "$package" --access public --tag "$tag"
                  done
                  npm publish dist/npm/ngchecks --access public --tag "$tag"
