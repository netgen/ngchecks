name: CI

on:
    push:
        branches:
            - 'master'
    pull_request: ~

permissions:
    contents: read

jobs:
    tests:
        name: Go tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - run: make lint
            - run: make test

    composer:
        name: Composer plugin
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'
                  coverage: none
            - run: composer validate --strict --no-check-lock
            - run: find composer/src -name '*.php' -print0 | xargs -0 -n 1 php -l

    packages:
        name: Release archives and npm packages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - uses: actions/setup-node@v7
              with:
                  node-version: 'lts/*'
            - run: scripts/build-release.sh 0.0.0-ci
            - run: scripts/build-npm.sh 0.0.0-ci
            - run: for package in dist/npm/*; do npm pack --dry-run "$package"; done

    docker:
        name: Docker image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-qemu-action@v4
            - uses: docker/setup-buildx-action@v4
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: false

    secrets:
        name: Secret scan
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - run: make build
            - run: bin/ngchecks secrets
